<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boole Arcade · Aventura Lógica</title>
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ==================== PANTALLA DE CARGA ==================== -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo-icon">🎮</div>
            <h1 class="splash-title">Boole Arcade</h1>
            <p class="splash-subtitle">AVENTURA LÓGICA</p>
            <div class="loading-bar-container">
                <div id="loading-bar" class="loading-bar"></div>
            </div>
            <p id="loading-text" class="loading-text">Cargando juegos...</p>
            <button id="btn-enter" class="btn-primary hidden">JUGAR</button>
        </div>
    </div>

    <!-- ==================== CONTENEDOR PRINCIPAL ==================== -->
    <div id="app-container" class="hidden">
        <!-- Cabecera / Barra superior -->
        <header id="main-header">
            <div class="header-left">
                <button id="btn-toggle-sidebar" class="icon-btn" aria-label="Menú">
                    <span>☰</span>
                </button>
                <span class="header-logo">🎮 Boole Arcade</span>
            </div>
            <div class="header-right">
                <button id="btn-fullscreen" class="icon-btn" title="Pantalla completa">
                    <span>⛶</span>
                </button>
                <div class="stat-badge">🔥 <span id="streak-count">1</span></div>
                <div class="stat-badge">⚡ <span id="xp-current">0</span> XP</div>
                <div class="stat-badge">🏆 Nv.<span id="level-number">1</span></div>
                <div class="stat-badge">🪙 <span id="coins-amount">0</span></div>
            </div>
        </header>

        <!-- Menú lateral (sidebar) -->
        <div id="sidebar-overlay" class="hidden"></div>
        <aside id="sidebar">
            <div class="sidebar-profile">
                <div class="avatar-display" id="avatar-display">🧑‍💻</div>
                <div class="username" id="sidebar-username">Agente Digital</div>
                <div class="user-title" id="sidebar-rank">Novato Binario</div>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-section="inicio">
                    <span class="nav-icon">🏠</span> Centro de Mando
                </button>

                <!-- Tema 1 -->
                <button class="nav-item" data-toggle="submenu1">
                    <span class="nav-icon">📖</span> 1. Fundamentos
                    <span id="lock-tema1" class="lock-icon">🔓</span>
                </button>
                <div id="submenu1" class="submenu hidden">
                    <button class="nav-item sub-nav" data-section="tema1" data-tab="game">🎮 Jugar</button>
                </div>

                <!-- Tema 2 -->
                <button class="nav-item" data-toggle="submenu2">
                    <span class="nav-icon">🔢</span> 2. Variables Booleanas
                    <span id="lock-tema2" class="lock-icon">🔒</span>
                </button>
                <div id="submenu2" class="submenu hidden">
                    <button class="nav-item sub-nav" data-section="tema2" data-tab="game">🎮 Jugar</button>
                </div>

                <!-- Tema 3 -->
                <button class="nav-item" data-toggle="submenu3">
                    <span class="nav-icon">🚪</span> 3. Compuertas Lógicas
                    <span id="lock-tema3" class="lock-icon">🔒</span>
                </button>
                <div id="submenu3" class="submenu hidden">
                    <button class="nav-item sub-nav" data-section="tema3" data-tab="game">🎮 Jugar</button>
                </div>

                <!-- Tema 4 -->
                <button class="nav-item" data-toggle="submenu4">
                    <span class="nav-icon">📊</span> 4. Tablas de Verdad
                    <span id="lock-tema4" class="lock-icon">🔒</span>
                </button>
                <div id="submenu4" class="submenu hidden">
                    <button class="nav-item sub-nav" data-section="tema4" data-tab="game">🎮 Jugar</button>
                </div>

                <!-- Tema 5 -->
                <button class="nav-item" data-toggle="submenu5">
                    <span class="nav-icon">✂️</span> 5. Simplificación
                    <span id="lock-tema5" class="lock-icon">🔒</span>
                </button>
                <div id="submenu5" class="submenu hidden">
                    <button class="nav-item sub-nav" data-section="tema5" data-tab="game">🎮 Jugar</button>
                </div>

                <!-- Tema 6 -->
                <button class="nav-item" data-toggle="submenu6">
                    <span class="nav-icon">💻</span> 6. Hardware y Circuitos
                    <span id="lock-tema6" class="lock-icon">🔒</span>
                </button>
                <div id="submenu6" class="submenu hidden">
                    <button class="nav-item sub-nav" data-section="tema6" data-tab="game">🎮 Jugar</button>
                </div>

                <!-- Tema 7 -->
                <button class="nav-item" data-toggle="submenu7">
                    <span class="nav-icon">🧠</span> 7. Procesadores
                    <span id="lock-tema7" class="lock-icon">🔒</span>
                </button>
                <div id="submenu7" class="submenu hidden">
                    <button class="nav-item sub-nav" data-section="tema7" data-tab="game">🎮 Jugar</button>
                </div>

                <!-- Tema 8 -->
                <button class="nav-item" data-toggle="submenu8">
                    <span class="nav-icon">⚡</span> 8. Optimización de Código
                    <span id="lock-tema8" class="lock-icon">🔒</span>
                </button>
                <div id="submenu8" class="submenu hidden">
                    <button class="nav-item sub-nav" data-section="tema8" data-tab="game">🎮 Jugar</button>
                </div>

                <button class="nav-item" data-section="logros">
                    <span class="nav-icon">🎖️</span> Logros
                </button>
                <button class="nav-item" data-section="tienda">
                    <span class="nav-icon">🛒</span> Tienda
                </button>
            </nav>
        </aside>

        <!-- Contenido principal -->
        <main id="main-content">
            <section id="section-inicio" class="content-section active"></section>
        </main>

        <!-- Pie de página -->
        <footer class="footer">
            <p>© 2025 Boole Arcade · <strong>GRUPO 4|MC</strong> · Todos los derechos reservados</p>
        </footer>
    </div>

    <!-- Botón flotante de WhatsApp -->
    <a href="https://wa.me/593989352793" target="_blank" class="whatsapp-float" title="Contactar al desarrollador">

    <!-- Contenedor de toasts -->
    <div id="toast-container"></div>

    <!-- Script externo (cargado al final) -->
    <script src="script.js" defer></script>
</body>
</html>
