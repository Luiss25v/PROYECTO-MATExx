<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BooleanQuest · Álgebra de Boole Gamificada</title>
    <style>
        :root {
            --bg-deep: #0a0e17;
            --bg-primary: #111827;
            --bg-secondary: #1a1f2e;
            --bg-tertiary: #242b3d;
            --bg-card: #1e2538;
            --bg-overlay: rgba(0, 0, 0, 0.7);
            --accent-cyan: #00e5ff;
            --accent-blue: #448aff;
            --accent-purple: #b388ff;
            --accent-green: #69f0ae;
            --accent-yellow: #ffd740;
            --accent-orange: #ff9100;
            --accent-red: #ff5252;
            --xp-color: #ffd740;
            --coin-color: #ffd740;
            --text-primary: #e8eaed;
            --text-secondary: #b0b8c4;
            --text-muted: #6b7280;
            --border-color: #2a3245;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: 0.3s ease;
            --font-main: 'Segoe UI', system-ui, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-main);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; transition: var(--transition); }
        .hidden { display: none !important; }

        /* ========== SPLASH ========== */
        #splash-screen {
            position: fixed; inset: 0; background: radial-gradient(ellipse at center, #0d1525, #050810);
            display: flex; align-items: center; justify-content: center; z-index: 10000;
            flex-direction: column; transition: opacity 0.8s, visibility 0.8s;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .logo-icon { font-size: 6rem; color: var(--accent-cyan); text-shadow: 0 0 40px #00e5ff; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
        .splash-logo h1 {
            font-size: 3.5rem; font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-top: 0.5rem;
        }
        .loading-bar-container { width: 300px; height: 8px; background: var(--bg-tertiary); border-radius: 4px; margin: 2rem 0 1rem; overflow: hidden; }
        .loading-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); transition: width 2s ease-in-out; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: #000; padding: 0.8rem 2rem; border-radius: var(--radius-xl); font-weight: 700; box-shadow: 0 4px 20px rgba(0,229,255,0.4); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(0,229,255,0.6); }

        /* ========== APP ========== */
        #app-container { display: flex; flex-direction: column; min-height: 100vh; }
        #main-header {
            height: 64px; background: var(--bg-primary); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem;
            position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px);
        }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .header-logo { font-size: 1.4rem; font-weight: 700; color: var(--accent-cyan); display: flex; align-items: center; gap: 0.5rem; }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .stat-badge { display: flex; align-items: center; gap: 0.3rem; background: var(--bg-secondary); padding: 0.4rem 0.8rem; border-radius: 20px; font-weight: 600; font-size: 0.85rem; border: 1px solid var(--border-color); }
        .badge { position: absolute; top: -5px; right: -5px; background: var(--accent-red); color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; }

        /* ========== SIDEBAR ========== */
        #sidebar {
            position: fixed; top: 64px; left: 0; width: 280px; height: calc(100vh - 64px);
            background: var(--bg-primary); border-right: 1px solid var(--border-color);
            z-index: 999; overflow-y: auto; transition: transform 0.3s;
        }
        #sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 998; }
        .sidebar-profile { padding: 2rem 1rem; text-align: center; border-bottom: 1px solid var(--border-color); }
        .avatar { font-size: 3rem; }
        .nav-item {
            display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem 1.5rem;
            font-weight: 500; color: var(--text-secondary); border-left: 3px solid transparent;
            transition: var(--transition);
        }
        .nav-item:hover, .nav-item.active { background: var(--bg-secondary); color: var(--accent-cyan); border-left-color: var(--accent-cyan); }
        .submenu { background: var(--bg-secondary); padding-left: 2rem; }
        .submenu .nav-item { font-size: 0.9rem; padding: 0.6rem 1.5rem; }

        /* ========== CONTENIDO PRINCIPAL ========== */
        #main-content { margin-left: 280px; padding: 2rem; flex: 1; }
        .content-section { display: none; animation: fadeUp 0.4s ease; }
        .content-section.active { display: block; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

        .lesson-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .lesson-card h3 { color: var(--accent-cyan); margin-bottom: 0.8rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .tab-btn { padding: 0.6rem 1.5rem; border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: transparent; color: var(--text-secondary); font-weight: 600; }
        .tab-btn.active { background: var(--bg-card); color: var(--accent-cyan); border: 1px solid var(--border-color); border-bottom: none; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; }
        .btn-secondary { background: var(--bg-tertiary); padding: 0.7rem 1.5rem; border-radius: var(--radius-xl); border: 1px solid var(--border-color); }
        .footer { background: var(--bg-primary); border-top: 1px solid var(--border-color); padding: 1.5rem; text-align: center; color: var(--text-muted); margin-top: auto; }

        /* ========== BOTÓN WHATSAPP ========== */
        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px; z-index: 9999;
            background: #25D366; color: #fff; width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; box-shadow: 0 4px 20px rgba(37,211,102,0.5);
            transition: transform 0.3s; animation: bounce 2s infinite;
        }
        .whatsapp-float:hover { transform: scale(1.1); }
        @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1024px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

                <div id="submenu4" class="submenu hidden">

                <div id="submenu5" class="submenu hidden">

                    <button class="nav-item" data-section="tema6" data-tab="teoria">📘 Teoría</button>
                    <button class="nav-item" data-section="tema6" data-tab="quiz">🧪 Quiz</button>
                </div>
                <button class="nav-item" data-section="tema7" data-bs-toggle="collapse" data-bs-target="#submenu7">🧠 7. Procesadores</button>
                <div id="submenu7" class="submenu hidden">
                    <button class="nav-item" data-section="tema7" data-tab="teoria">📘 Teoría</button>
                    <button class="nav-item" data-section="tema7" data-tab="quiz">🧪 Quiz</button>
                </div>
                <button class="nav-item" data-section="tema8" data-bs-toggle="collapse" data-bs-target="#submenu8">⚡ 8. Optimización de Código</button>

                <button class="nav-item" data-section="tienda">🛒 Tienda</button>
            </nav>
        </aside>

        <main id="main-content">
            <!-- Secciones dinámicas generadas por JS -->
            <section id="section-inicio" class="content-section active"></section>

        <footer class="footer">
            <p>© 2025 BooleanQuest · GRUPO 4|MC · Todos los derechos reservados</p>

    </div>

    <!-- Botón WhatsApp -->

</html>
