<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Quest: Álgebra de Boole</title>
    <style>
        /* ========== RESET Y ESTILOS GLOBALES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0a0f0a;
            color: #e0ffe0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 800px;
            min-height: 90vh;
            background: rgba(10, 20, 10, 0.95);
            border: 2px solid #0f0;
            border-radius: 15px;
            box-shadow: 0 0 25px #0f0, inset 0 0 15px rgba(0, 255, 0, 0.1);
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .screen.active {
            display: flex;
        }

        /* ========== BARRA SUPERIOR ========== */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #111;
            border: 1px solid #0f0;
            border-radius: 10px;
            font-size: 0.9em;
        }

        .score-display {
            color: #ff0;
            font-weight: bold;
        }

        .progress-container {
            flex: 1;
            margin: 0 20px;
            height: 12px;
            background: #222;
            border: 1px solid #0f0;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f0, #0a0);
            transition: width 0.5s;
            width: 0%;
        }

        #badges-btn {
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8em;
            transition: all 0.3s;
        }

        #badges-btn:hover {
            background: #0f0;
            color: #000;
        }

        /* ========== PANTALLA DE INICIO ========== */
        #start-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #start-screen h1 {
            font-size: 2.8em;
            text-shadow: 0 0 20px #0f0;
            margin-bottom: 0.5em;
        }

        #start-screen p {
            max-width: 600px;
            margin: 0 auto 2em;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .btn {
            background: transparent;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 12px 30px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 30px #0f0;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ========== SELECTOR DE NIVELES ========== */
        #level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .level-card {
            background: #111;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #555;
        }

        .level-card.unlocked:not(.completed):hover {
            border-color: #0f0;
            box-shadow: 0 0 15px #0f0;
            transform: translateY(-3px);
        }

        .level-card.completed {
            border-color: #0f0;
        }

        .level-card .stars {
            margin-top: 8px;
            color: #ff0;
            font-size: 1.2em;
        }

        .level-card h3 {
            color: #0f0;
            margin-bottom: 5px;
        }

        .level-card p {
            font-size: 0.8em;
            color: #aaa;
        }

        .lock-icon {
            font-size: 2em;
            opacity: 0.6;
        }

        /* ========== PANTALLA DE NIVEL ========== */
        #level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        #level-content {
            flex: 1;
            background: #0c1a0c;
            border: 1px solid #0f0;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
            max-height: 60vh;
        }

        .learning {
            margin-bottom: 20px;
        }

        .learning h2 {
            color: #ff0;
            margin-bottom: 10px;
        }

        .learning p, .learning ul {
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .quiz-area {
            border-top: 2px dashed #0f0;
            padding-top: 20px;
            margin-top: 20px;
        }

        .question {
            background: #0a1a0a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .option {
            background: #1a2a1a;
            border: 1px solid #0f0;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .option:hover {
            background: #0f0;
            color: #000;
        }

        .option.selected {
            background: #0f0;
            color: #000;
            font-weight: bold;
        }

        .truth-table {
            margin: 20px auto;
            border-collapse: collapse;
        }

        .truth-table th, .truth-table td {
            border: 1px solid #0f0;
            padding: 8px 15px;
            text-align: center;
        }

        .truth-table select {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px;
            font-family: inherit;
        }

        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
        }

        .feedback.correct {
            background: #1a3a1a;
            color: #0f0;
        }

        .feedback.incorrect {
            background: #3a1a1a;
            color: #f66;
        }

        .btn-small {
            padding: 8px 20px;
            font-size: 0.9em;
        }

        /* ========== MODAL DE INSIGNIAS ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0a1a0a;
            border: 2px solid #0f0;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .badge-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .badge-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
        }

        .badge-icon {
            font-size: 2.5em;
            filter: grayscale(100%);
        }

        .badge-icon.earned {
            filter: none;
        }

        /* ========== RESULTADO ========== */
        #result-screen {
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .result-stars {
            font-size: 3em;
            margin: 20px 0;
        }

    </style>
</head>
<body>
    <div id="app">
        <!-- PANTALLA DE INICIO -->
        <div id="start-screen" class="screen active">
            <h1>🤖 LOGIC QUEST</h1>
            <p>Bienvenido, futuro Ingeniero Lógico. Domina el Álgebra de Boole para construir el procesador definitivo y salvar el reino digital. Aprende sobre variables, funciones, simplificación y cómo todo esto da vida al hardware real.</p>
            <button class="btn" id="start-btn">▶ COMENZAR</button>
            <button class="btn" id="reset-btn">🗑 Reiniciar Progreso</button>
        </div>

        <!-- SELECTOR DE NIVELES -->
        <div id="level-select-screen" class="screen">
            <div id="top-bar">
                <span class="score-display">⚡ <span id="score">0</span> pts</span>
                <div class="progress-container"><div class="progress-fill" id="progress-fill"></div></div>
                <button id="badges-btn" class="btn-small">🏆 Insignias</button>
            </div>
            <h2>🌐 Mapa de Niveles</h2>
            <div id="level-grid"></div>
        </div>

        <!-- PANTALLA DE NIVEL -->
        <div id="level-screen" class="screen">
            <div id="level-header">
                <button class="btn btn-small" id="back-btn">◀ Volver</button>
                <h3 id="level-title"></h3>
                <span></span>
            </div>
            <div id="level-content"></div>
        </div>

        <!-- RESULTADO DEL NIVEL -->
        <div id="result-screen" class="screen">
            <h2 id="result-message"></h2>
            <div class="result-stars" id="result-stars"></div>
            <p id="result-score"></p>
            <button class="btn" id="continue-btn">Continuar ▶</button>
        </div>

        <!-- MODAL DE INSIGNIAS -->
        <div id="badges-modal" class="modal">
            <div class="modal-content">
                <h2>🏅 Insignias</h2>
                <div class="badge-grid" id="badge-container"></div>
                <button class="btn btn-small" id="close-modal">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ========== AUDIO SIMPLE ==========
            let audioCtx = null;
            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            function playBeep(freq, duration, type = 'square') {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }

            // ========== DATOS DE NIVELES ==========
            const levelsData = [
                {
                    id: 1,
                    name: 'Variables Booleanas',
                    description: 'Verdadero/Falso y tablas básicas',
                    learning: `
                        <h2>📘 Variables Booleanas</h2>
                        <p>El álgebra de Boole trabaja con dos valores: <strong>0 (FALSO)</strong> y <strong>1 (VERDADERO)</strong>. Las operaciones fundamentales son:</p>
                        <ul>
                            <li><strong>NOT (¬)</strong>: Invierte el valor.</li>
                            <li><strong>AND (∧)</strong>: 1 solo si ambas entradas son 1.</li>
                            <li><strong>OR (∨)</strong>: 1 si al menos una entrada es 1.</li>
                        </ul>
                        <p>📌 <em>En hardware, un 1 representa un voltaje alto (ej. 5V) y un 0 un voltaje bajo (0V). Las compuertas lógicas implementan estas operaciones con transistores.</em></p>
                    `,
                    quizType: 'truth-table',
                    questions: [
                        { type: 'truth-table', gate: 'NOT', inputs: ['A'], rows: [{A:0}, {A:1}], outputCol: 'NOT A', expected: [1,0] },
                        { type: 'truth-table', gate: 'AND', inputs: ['A','B'], rows: [{A:0,B:0},{A:0,B:1},{A:1,B:0},{A:1,B:1}], outputCol: 'A AND B', expected: [0,0,0,1] },
                        { type: 'truth-table', gate: 'OR', inputs: ['A','B'], rows: [{A:0,B:0},{A:0,B:1},{A:1,B:0},{A:1,B:1}], outputCol: 'A OR B', expected: [0,1,1,1] }
                    ]
                },
                {
                    id: 2,
                    name: 'Compuertas Lógicas',
                    description: 'Símbolos y comportamiento',
                    learning: `
                        <h2>🔌 Compuertas Lógicas</h2>
                        <p>Los circuitos digitales se construyen con compuertas. Cada una tiene un símbolo único:</p>
                        <p>AND: <svg width="50" height="30"><path d="M8,5 Q30,5 40,15 Q30,25 8,25 L8,5" fill="none" stroke="#0f0" stroke-width="2"/><line x1="0" y1="8" x2="8" y2="8" stroke="#0f0"/><line x1="0" y1="22" x2="8" y2="22" stroke="#0f0"/><line x1="40" y1="15" x2="50" y2="15" stroke="#0f0"/></svg>  
                        OR: <svg width="50" height="30"><path d="M8,5 Q20,5 30,10 Q35,15 30,20 Q20,25 8,25 L8,5" fill="none" stroke="#0f0" stroke-width="2"/><line x1="0" y1="8" x2="8" y2="8" stroke="#0f0"/><line x1="0" y1="22" x2="8" y2="22" stroke="#0f0"/><line x1="32" y1="15" x2="50" y2="15" stroke="#0f0"/></svg>  
                        NOT: <svg width="50" height="30"><polygon points="8,5 30,15 8,25" fill="none" stroke="#0f0" stroke-width="2"/><circle cx="33" cy="15" r="3" fill="none" stroke="#0f0" stroke-width="2"/><line x1="0" y1="15" x2="8" y2="15" stroke="#0f0"/><line x1="36" y1="15" x2="50" y2="15" stroke="#0f0"/></svg></p>
                        <p>📌 <em>Un procesador moderno contiene miles de millones de estas compuertas organizadas en bloques como la ALU y la unidad de control.</em></p>
                    `,
                    quizType: 'mcq',
                    questions: [
                        { question: '¿Qué compuerta representa este símbolo? <br><svg width="50" height="30"><path d="M8,5 Q30,5 40,15 Q30,25 8,25 L8,5" fill="none" stroke="#0f0" stroke-width="2"/><line x1="0" y1="8" x2="8" y2="8" stroke="#0f0"/><line x1="0" y1="22" x2="8" y2="22" stroke="#0f0"/><line x1="40" y1="15" x2="50" y2="15" stroke="#0f0"/></svg>', options: ['AND', 'OR', 'NOT', 'XOR'], correct: 0 },
                        { question: 'La salida de una compuerta OR es 1 solo si...', options: ['Ambas entradas son 1', 'Al menos una entrada es 1', 'Ninguna entrada es 1', 'Las entradas son diferentes'], correct: 1 },
                        { question: '¿Qué compuerta tiene la función de invertir la señal?', options: ['AND', 'OR', 'NOT', 'Buffer'], correct: 2 }
                    ]
                },
                {
                    id: 3,
                    name: 'Funciones Booleanas',
                    description: 'Evaluar expresiones',
                    learning: `
                        <h2>🧮 Funciones Booleanas</h2>
                        <p>Una función booleana combina variables con operadores. Ejemplo: <code>F = (A ∧ B) ∨ (¬C)</code></p>
                        <p>Para evaluarla, sustituimos los valores de las variables y aplicamos las operaciones.</p>
                        <p>📌 <em>En diseño de circuitos, una función booleana describe el comportamiento de un bloque lógico. Simplificarla reduce el número de compuertas necesarias.</em></p>
                    `,
                    quizType: 'mcq',
                    questions: [
                        { question: 'Evalúa F = (A AND B) OR (NOT C) con A=1, B=0, C=1', options: ['0', '1', 'A', 'Error'], correct: 0 },
                        { question: 'Evalúa F = NOT(A) AND (B OR C) con A=0, B=0, C=1', options: ['0', '1', 'B', 'C'], correct: 1 },
                        { question: 'Si F = A XOR B, ¿cuál es el resultado con A=1, B=1?', options: ['0', '1', 'A', 'B'], correct: 0 }
                    ]
                },
                {
                    id: 4,
                    name: 'Simplificación',
                    description: 'Leyes y reducción',
                    learning: `
                        <h2>✂️ Simplificación de Expresiones</h2>
                        <p>Usando leyes del álgebra de Boole podemos reducir expresiones:</p>
                        <ul>
                            <li><strong>Absorción:</strong> A + A·B = A</li>
                            <li><strong>De Morgan:</strong> ¬(A·B) = ¬A + ¬B ; ¬(A+B) = ¬A · ¬B</li>
                            <li><strong>Idempotencia:</strong> A + A = A</li>
                        </ul>
                        <p>📌 <em>Simplificar una función booleana minimiza el número de compuertas en un chip, lo que reduce el consumo energético y aumenta la velocidad del procesador.</em></p>
                    `,
                    quizType: 'mcq',
                    questions: [
                        { question: 'Simplifica: A + (A · B)', options: ['A', 'B', 'A·B', 'A+B'], correct: 0 },
                        { question: 'Aplicando De Morgan, ¬(A · B) equivale a:', options: ['¬A · ¬B', '¬A + ¬B', 'A + B', 'A · B'], correct: 1 },
                        { question: 'La expresión A · (A + B) se simplifica a:', options: ['A', 'B', 'A+B', 'A·B'], correct: 0 }
                    ]
                },
                {
                    id: 5,
                    name: 'Mapa de Karnaugh',
                    description: 'Simplificación visual',
                    learning: `
                        <h2>🗺 Mapa de Karnaugh (2 variables)</h2>
                        <p>El mapa de Karnaugh es una herramienta gráfica para simplificar funciones. Para 2 variables (A,B):</p>
                        <table class="truth-table">
                            <tr><th>A\\B</th><th>0</th><th>1</th></tr>
                            <tr><td>0</td><td>0</td><td>1</td></tr>
                            <tr><td>1</td><td>1</td><td>0</td></tr>
                        </table>
                        <p>Agrupando los "1" adyacentes obtenemos la expresión simplificada.</p>
                    `,
                    quizType: 'kmap',
                    questions: [
                        {
                            kmap: [[0,1],[1,0]], // Representa A'B + AB' = A XOR B
                            question: 'Observa el mapa de Karnaugh mostrado. ¿Cuál es la expresión simplificada?',
                            options: ['A AND B', 'A OR B', 'A XOR B', 'NOT A'],
                            correct: 2
                        }
                    ]
                },
                {
                    id: 6,
                    name: 'Semisumador (Half-Adder)',
                    description: 'Circuito sumador básico',
                    learning: `
                        <h2>➕ Semisumador</h2>
                        <p>Un semisumador suma dos bits (A y B) y produce un bit de <strong>Suma (S)</strong> y uno de <strong>Acarreo (C)</strong>.</p>
                        <p>S = A XOR B<br>C = A AND B</p>
                        <p>📌 <em>Los sumadores son la base de la Unidad Aritmético-Lógica (ALU) de todo procesador. La ALU realiza operaciones matemáticas y lógicas.</em></p>
                    `,
                    quizType: 'truth-table',
                    questions: [
                        {
                            type: 'truth-table',
                            gate: 'Half-Adder',
                            inputs: ['A','B'],
                            rows: [{A:0,B:0},{A:0,B:1},{A:1,B:0},{A:1,B:1}],
                            outputCols: ['Suma (S)', 'Acarreo (C)'],
                            expected: [0,0, 1,0, 1,0, 0,1] // S0C0, S1C0, S1C0, S0C1
                        }
                    ]
                },
                {
                    id: 7,
                    name: 'Optimización de Código',
                    description: 'Booleanos en programación',
                    learning: `
                        <h2>💻 Optimización de Condiciones</h2>
                        <p>En programación, las expresiones booleanas pueden simplificarse para mejorar la legibilidad y eficiencia.</p>
                        <p>Ejemplo: <code>if (!a && !b)</code> es equivalente a <code>if (!(a || b))</code> (De Morgan).</p>
                        <p>📌 <em>Los compiladores aplican álgebra de Boole para optimizar el código máquina, reduciendo instrucciones y mejorando el rendimiento.</em></p>
                    `,
                    quizType: 'mcq',
                    questions: [
                        { question: '¿Cuál es una versión simplificada de <code>if(!(x > 5 && y < 3))</code>?', options: ['if(x <= 5 || y >= 3)', 'if(x > 5 || y < 3)', 'if(x <= 5 && y >= 3)', 'Ninguna'], correct: 0 },
                        { question: 'La expresión <code>(a && b) || (!a && b)</code> se reduce a:', options: ['a', 'b', 'a || b', 'true'], correct: 1 }
                    ]
                }
            ];

            // ========== ESTADO DEL JUEGO ==========
            const STORAGE_KEY = 'logicQuestSave';
            let gameState = {
                score: 0,
                badges: [],
                levels: levelsData.map((lvl, idx) => ({
                    id: lvl.id,
                    unlocked: idx === 0,
                    completed: false,
                    stars: 0,
                    bestScore: 0
                })),
                currentLevelId: null,
                currentQuestionIndex: 0,
                userAnswers: [],
                levelScore: 0
            };

            // ========== FUNCIONES DE GUARDADO ==========
            function saveState() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    score: gameState.score,
                    badges: gameState.badges,
                    levels: gameState.levels
                }));
            }

            function loadState() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    gameState.score = parsed.score || 0;
                    gameState.badges = parsed.badges || [];
                    if (parsed.levels) {
                        parsed.levels.forEach((sl, i) => {
                            if (gameState.levels[i]) {
                                gameState.levels[i].unlocked = sl.unlocked;
                                gameState.levels[i].completed = sl.completed;
                                gameState.levels[i].stars = sl.stars;
                                gameState.levels[i].bestScore = sl.bestScore;
                            }
                        });
                    }
                }
            }

            function resetProgress() {
                if (confirm('¿Seguro que quieres borrar todo el progreso?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    gameState.score = 0;
                    gameState.badges = [];
                    gameState.levels.forEach((lvl, idx) => {
                        lvl.unlocked = idx === 0;
                        lvl.completed = false;
                        lvl.stars = 0;
                        lvl.bestScore = 0;
                    });
                    showScreen('start-screen');
                }
            }

            // ========== NAVEGACIÓN DE PANTALLAS ==========
            function showScreen(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
                if (screenId === 'level-select-screen') renderLevelSelect();
            }

            // ========== RENDERIZADO DEL SELECTOR DE NIVELES ==========
            function renderLevelSelect() {
                const grid = document.getElementById('level-grid');
                grid.innerHTML = '';
                gameState.levels.forEach((lvl, idx) => {
                    const data = levelsData[idx];
                    const card = document.createElement('div');
                    card.className = `level-card ${lvl.unlocked ? (lvl.completed ? 'completed' : 'unlocked') : 'locked'}`;
                    card.innerHTML = `
                        <h3>${data.name}</h3>
                        <p>${data.description}</p>
                        ${lvl.unlocked ? `<div class="stars">${'★'.repeat(lvl.stars)}${'☆'.repeat(3-lvl.stars)}</div>` : '<div class="lock-icon">🔒</div>'}
                    `;
                    if (lvl.unlocked) {
                        card.addEventListener('click', () => startLevel(data.id));
                    }
                    grid.appendChild(card);
                });
                document.getElementById('score').textContent = gameState.score;
                updateProgressBar();
            }

            function updateProgressBar() {
                const totalStars = gameState.levels.length * 3;
                const earned = gameState.levels.reduce((sum, l) => sum + l.stars, 0);
                const percent = totalStars ? (earned / totalStars) * 100 : 0;
                document.getElementById('progress-fill').style.width = percent + '%';
            }

            // ========== INICIAR NIVEL ==========
            function startLevel(levelId) {
                gameState.currentLevelId = levelId;
                gameState.currentQuestionIndex = 0;
                gameState.userAnswers = [];
                gameState.levelScore = 0;
                showScreen('level-screen');
                const level = levelsData.find(l => l.id === levelId);
                document.getElementById('level-title').textContent = level.name;
                renderLevelContent(level);
            }

            function renderLevelContent(level) {
                const content = document.getElementById('level-content');
                let html = `<div class="learning">${level.learning}</div>`;
                html += `<div class="quiz-area" id="quiz-area"></div>`;
                content.innerHTML = html;
                showQuestion(level, 0);
            }

            function showQuestion(level, qIndex) {
                if (qIndex >= level.questions.length) {
                    finishLevel();
                    return;
                }
                gameState.currentQuestionIndex = qIndex;
                const quizArea = document.getElementById('quiz-area');
                const question = level.questions[qIndex];
                let html = '';
                if (question.type === 'truth-table') {
                    html = renderTruthTableQuestion(question, qIndex);
                } else if (question.type === 'mcq') {
                    html = renderMCQQuestion(question, qIndex);
                } else if (question.type === 'kmap') {
                    html = renderKMapQuestion(question, qIndex);
                }
                quizArea.innerHTML = html;
                // Agregar eventos después de renderizar
                if (question.type === 'mcq' || question.type === 'kmap') {
                    document.querySelectorAll('.option').forEach(opt => {
                        opt.addEventListener('click', function() {
                            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                            this.classList.add('selected');
                        });
                    });
                    document.getElementById('submit-answer')?.addEventListener('click', () => handleMCQAnswer(level, qIndex));
                } else if (question.type === 'truth-table') {
                    document.getElementById('submit-table')?.addEventListener('click', () => handleTruthTableAnswer(level, qIndex));
                }
            }

            function renderTruthTableQuestion(q, idx) {
                let html = `<div class="question"><p><strong>Completa la tabla de verdad para ${q.gate}:</strong></p>`;
                html += `<table class="truth-table"><tr>`;
                q.inputs.forEach(inp => html += `<th>${inp}</th>`);
                const outputs = q.outputCols || [q.outputCol];
                outputs.forEach(out => html += `<th>${out}</th>`);
                html += `</tr>`;
                q.rows.forEach((row, ri) => {
                    html += `<tr>`;
                    q.inputs.forEach(inp => html += `<td>${row[inp]}</td>`);
                    outputs.forEach((_, oi) => {
                        const cellIdx = ri * outputs.length + oi;
                        html += `<td><select class="cell-input" data-cell="${cellIdx}">
                                    <option value="-1">?</option>
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                </select></td>`;
                    });
                    html += `</tr>`;
                });
                html += `</table>`;
                html += `<button class="btn btn-small" id="submit-table">Verificar</button>`;
                html += `<div class="feedback" id="feedback-${idx}"></div></div>`;
                return html;
            }

            function handleTruthTableAnswer(level, qIndex) {
                const question = level.questions[qIndex];
                const selects = document.querySelectorAll('.cell-input');
                const outputs = question.outputCols ? question.outputCols.length : 1;
                const userVals = [];
                let allAnswered = true;
                selects.forEach(sel => {
                    const val = parseInt(sel.value);
                    if (val === -1) allAnswered = false;
                    userVals.push(val);
                });
                if (!allAnswered) {
                    document.getElementById(`feedback-${qIndex}`).innerHTML = '<span style="color:orange;">⚠️ Completa todas las celdas.</span>';
                    return;
                }
                const expected = question.expected;
                let correctCount = 0;
                userVals.forEach((v, i) => { if (v === expected[i]) correctCount++; });
                const totalCells = expected.length;
                const pointsEarned = Math.round((correctCount / totalCells) * 10);
                gameState.levelScore += pointsEarned;
                const feedback = document.getElementById(`feedback-${qIndex}`);
                if (correctCount === totalCells) {
                    feedback.innerHTML = '<span class="correct">✅ ¡Correcto! +' + pointsEarned + ' pts</span>';
                    playBeep(800, 0.2, 'square');
                } else {
                    feedback.innerHTML = `<span class="incorrect">❌ ${correctCount}/${totalCells} correctas. Revisa las respuestas. +${pointsEarned} pts</span>`;
                    playBeep(200, 0.3, 'sawtooth');
                }
                gameState.userAnswers.push({ questionIndex: qIndex, points: pointsEarned });
                document.getElementById('submit-table').disabled = true;
                setTimeout(() => showQuestion(level, qIndex + 1), 1500);
            }

            function renderMCQQuestion(q, idx) {
                let html = `<div class="question"><p><strong>${q.question}</strong></p><div class="options">`;
                q.options.forEach((opt, oi) => {
                    html += `<div class="option" data-index="${oi}">${opt}</div>`;
                });
                html += `</div>`;
                html += `<button class="btn btn-small" id="submit-answer">Enviar</button>`;
                html += `<div class="feedback" id="feedback-${idx}"></div></div>`;
                return html;
            }

            function handleMCQAnswer(level, qIndex) {
                const selected = document.querySelector('.option.selected');
                if (!selected) {
                    document.getElementById(`feedback-${qIndex}`).innerHTML = '<span style="color:orange;">⚠️ Selecciona una opción.</span>';
                    return;
                }
                const chosen = parseInt(selected.dataset.index);
                const question = level.questions[qIndex];
                const isCorrect = chosen === question.correct;
                const pointsEarned = isCorrect ? 10 : 0;
                gameState.levelScore += pointsEarned;
                const feedback = document.getElementById(`feedback-${qIndex}`);
                if (isCorrect) {
                    feedback.innerHTML = '<span class="correct">✅ ¡Correcto! +10 pts</span>';
                    playBeep(800, 0.2);
                } else {
                    feedback.innerHTML = `<span class="incorrect">❌ Incorrecto. La respuesta correcta es: ${question.options[question.correct]}</span>`;
                    playBeep(200, 0.4, 'sawtooth');
                }
                gameState.userAnswers.push({ questionIndex: qIndex, points: pointsEarned });
                document.getElementById('submit-answer').disabled = true;
                document.querySelectorAll('.option').forEach(o => o.style.pointerEvents = 'none');
                setTimeout(() => showQuestion(level, qIndex + 1), 2000);
            }

            function renderKMapQuestion(q, idx) {
                let html = `<div class="question"><p><strong>${q.question}</strong></p>`;
                // Mostrar el mapa de Karnaugh
                html += `<table class="truth-table"><tr><th>A\\B</th><th>0</th><th>1</th></tr>`;
                for (let i = 0; i < 2; i++) {
                    html += `<tr><td>${i}</td>`;
                    for (let j = 0; j < 2; j++) {
                        html += `<td>${q.kmap[i][j]}</td>`;
                    }
                    html += `</tr>`;
                }
                html += `</table>`;
                html += `<div class="options">`;
                q.options.forEach((opt, oi) => {
                    html += `<div class="option" data-index="${oi}">${opt}</div>`;
                });
                html += `</div>`;
                html += `<button class="btn btn-small" id="submit-answer">Enviar</button>`;
                html += `<div class="feedback" id="feedback-${idx}"></div></div>`;
                return html;
            }

            // ========== FINALIZAR NIVEL ==========
            function finishLevel() {
                const levelIdx = gameState.levels.findIndex(l => l.id === gameState.currentLevelId);
                if (levelIdx === -1) return;
                const levelState = gameState.levels[levelIdx];
                const maxPoints = levelsData[levelIdx].questions.reduce((acc, q) => {
                    if (q.type === 'truth-table') return acc + 10; // cada tabla da max 10
                    return acc + 10;
                }, 0);
                const percentage = maxPoints ? gameState.levelScore / maxPoints : 0;
                let stars = 0;
                if (percentage >= 0.9) stars = 3;
                else if (percentage >= 0.5) stars = 2;
                else if (percentage > 0) stars = 1;

                if (stars > levelState.stars) levelState.stars = stars;
                if (gameState.levelScore > levelState.bestScore) levelState.bestScore = gameState.levelScore;
                levelState.completed = true;
                gameState.score += gameState.levelScore;

                // Desbloquear siguiente nivel
                if (levelIdx + 1 < gameState.levels.length) {
                    gameState.levels[levelIdx + 1].unlocked = true;
                }

                // Otorgar insignias
                awardBadges(levelIdx, stars);

                saveState();
                showResultScreen(stars, gameState.levelScore);
            }

            function showResultScreen(stars, score) {
                showScreen('result-screen');
                document.getElementById('result-message').textContent = '🎉 ¡Nivel Completado!';
                document.getElementById('result-stars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
                document.getElementById('result-score').textContent = `Puntuación: +${score} pts`;
                document.getElementById('continue-btn').onclick = () => {
                    showScreen('level-select-screen');
                };
            }

            // ========== INSIGNIAS ==========
            const badgeDefinitions = [
                { id: 'truth_master', name: 'Maestro de la Verdad', icon: '📋', condition: (s) => s.levels[0].stars === 3 },
                { id: 'gate_guru', name: 'Guardián de las Compuertas', icon: '🔌', condition: (s) => s.levels[1].stars === 3 },
                { id: 'eval_expert', name: 'Evaluador Experto', icon: '🧮', condition: (s) => s.levels[2].stars === 3 },
                { id: 'simplifier', name: 'Simplificador Supremo', icon: '✂️', condition: (s) => s.levels[3].stars === 3 },
                { id: 'kmap_cartographer', name: 'Cartógrafo de Karnaugh', icon: '🗺', condition: (s) => s.levels[4].stars === 3 },
                { id: 'digital_designer', name: 'Diseñador Digital', icon: '➕', condition: (s) => s.levels[5].stars === 3 },
                { id: 'code_optimizer', name: 'Optimizador de Código', icon: '💻', condition: (s) => s.levels[6].stars === 3 },
                { id: 'logic_engineer', name: 'Ingeniero Lógico', icon: '🏆', condition: (s) => s.levels.every(l => l.stars === 3) }
            ];

            function awardBadges(completedLevelIdx, stars) {
                badgeDefinitions.forEach(badge => {
                    if (gameState.badges.includes(badge.id)) return;
                    if (badge.condition(gameState)) {
                        gameState.badges.push(badge.id);
                        alert(`🏅 ¡Nueva insignia!: ${badge.name}`);
                    }
                });
            }

            function renderBadgesModal() {
                const container = document.getElementById('badge-container');
                container.innerHTML = '';
                badgeDefinitions.forEach(badge => {
                    const earned = gameState.badges.includes(badge.id);
                    const div = document.createElement('div');
                    div.className = 'badge-item';
                    div.innerHTML = `<span class="badge-icon ${earned ? 'earned' : ''}">${badge.icon}</span><small>${badge.name}</small>`;
                    container.appendChild(div);
                });
                document.getElementById('badges-modal').classList.add('active');
            }

            // ========== EVENTOS GLOBALES ==========
            document.getElementById('start-btn').addEventListener('click', () => {
                initAudio();
                showScreen('level-select-screen');
            });

            document.getElementById('reset-btn').addEventListener('click', resetProgress);

            document.getElementById('back-btn').addEventListener('click', () => {
                showScreen('level-select-screen');
            });

            document.getElementById('badges-btn').addEventListener('click', renderBadgesModal);
            document.getElementById('close-modal').addEventListener('click', () => {
                document.getElementById('badges-modal').classList.remove('active');
            });

            // Inicializar
            loadState();
            // Si ya había progreso, mostrar selector de niveles, si no, inicio
            if (gameState.levels.some(l => l.completed)) {
                showScreen('level-select-screen');
            } else {
                showScreen('start-screen');
            }
        })();
    </script>
</body>
</html>
